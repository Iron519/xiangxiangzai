services:
  my_agent_db:
    image: pgvector/pgvector:pg18
    container_name: PostgreSQL
    environment:
      POSTGRES_USER: yutiexin
      POSTGRES_PASSWORD: YTX519PGmm
      POSTGRES_DB: my_agent
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yutiexin -d my_agent"]
      interval: 10s
      timeout: 5s
      retries: 5

  my_agent_redis:
    image: redis:7-alpine
    container_name: Redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  my_agent_python:
    build: .
    image: myagent-python
    container_name: Python
    working_dir: /app
    ports:
      - "8099:8099"
    volumes:
      - .:/app
    command: sleep infinity

volumes:
  pg_data:
  redis_data:
