services:
  my_agent_db:
    image: pgvector/pgvector:pg18
    container_name: PostgreSQL
    environment:
      POSTGRES_USER: yutiexin
      POSTGRES_PASSWORD: YTX519PGmm
      POSTGRES_DB: my_agent
      POSTGRES_INITDB_ARGS: "-E UTF8"
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yutiexin -d my_agent"]
      interval: 10s
      timeout: 5s
      retries: 5

  my_agent_redis:
    image: redis:7-alpine
    container_name: Redis
    environment:
      TZ: Asia/Shanghai
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  my_agent_python:
    build: .
    image: myagent-python
    container_name: Python
    working_dir: /app
    environment:
      TZ: Asia/Shanghai
      ENV: dev
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
    ports:
      - "8099:8099"
    volumes:
      - .:/app
    command: sh -c 'if [ "$ENV" = "prod" ]; then uvicorn app.app:app --host 0.0.0.0 --port 8099 --workers 4; else uvicorn app.app:app --host 0.0.0.0 --port 8099 --workers 1 --reload; fi'
    depends_on:
      my_agent_db:
        condition: service_healthy
      my_agent_redis:
        condition: service_healthy

volumes:
  pg_data:
  redis_data:
